spring.application.name=Assignment
server.port=8081 

spring.datasource.url=jdbc:mariadb://localhost:3306/cms_db?createDatabaseIfNotExist=true
spring.datasource.username=root

spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:DDL.sql


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=BulkUpload-

